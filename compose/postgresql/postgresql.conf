# PostgreSQL OLTP configuration for Home-ERP

# Connectivity
max_connections = 20

# Memory allocation (baseline: 2 GB RAM)
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 128MB
work_mem = 21845kB
wal_buffers = 16MB

# Checkpoints and Write-Ahead Log
checkpoint_completion_target = 0.9
min_wal_size = 2GB
max_wal_size = 8GB
wal_compression = lz4

# Query planner cost settings (SSD)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Worker concurrency (baseline: 4 CPUs)
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Optimization flags
huge_pages = off
jit = off

# Note: io_method requires PostgreSQL 18+ compiled with liburing.
# io_method = io_uring
