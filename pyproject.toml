[project]
name = "home-erp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diego Rivera", email = "diego.rivera.estefano@gmail.com" }
]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "celery[msgpack]==5.6.3",
  "click==8.3.3",
  "cryptography==46.0.0",
  "django==6.0.4",
  "django-allauth==65.16.1",
  "django-anymail==15.0",
  "django-axes[ipware]==8.3.1",
  "django-celery-beat==2.9.0",
  "django-celery-results==2.6.0",
  "django-compressor==4.6.0",
  "django-cors-headers==4.9.0",
  "django-cotton==2.6.2",
  "django-crispy-forms==2.6",
  "django-csp==4.0",
  "django-dbbackup>=5.3.0",
  "django-environ==0.13.0",
  "django-filter==25.2",
  "django-formtools==2.5.1",
  "django-imagekit==6.1.0",
  "django-import-export==4.4.0",
  "django-model-utils==5.0.0",
  "django-pgtrigger>=4.17.0",
  "django-recurrence==1.14",
  "django-redis==6.0.0",
  "django-reversion==6.1.0",
  "django-structlog==10.1.0",
  "django-taggit==6.1.0",
  "django-tree-queries==0.26.1",
  "django-unfold==0.90.0",
  "django-viewflow==2.2.15",
  "django-waffle==5.0.0",
  "djangorestframework==3.17.1",
  "drf-spectacular==0.29.0",
  "granian==2.7.5",
  "hiredis==3.3.1",
  "openpyxl==3.1.2",
  "pgvector==0.4.2",
  "pillow==12.2.0",
  "psutil==7.2.2",
  "psycopg[binary,pool]==3.3.3",
  "pydantic==2.13.3",
  "python-dateutil==2.9.0.post0",
  "python-slugify==8.0.4",
  "redis==7.4.0",
  "urllib3==2.6.3",
  "uuid6==2025.0.1",
  "whitenoise==6.12.0",
  "polars>=1.42.1",
  "gevent>=26.5.0",
  "factory-boy==3.3.3",
  "brotli>=1.2.0",
  "csscompressor>=0.9.5",
  "lz4>=4.4.5",
]

[dependency-groups]
dev = [
  "django-browser-reload==1.21.0",
  "django-debug-toolbar==6.3.0",
  "django-extensions==4.1",
  "django-watchfiles==1.4.0",
  "django-zeal>=2.2.2",
  "djlint==1.36.4",
  "importtime-waterfall>=1.0.0",
  "ipdb==0.13.13",
  "mypy==1.20.2",
  "pre-commit==4.6.0",
  "pyopenssl>=26.2.0",
  "pyrefly==1.0.0",
  "ruff==0.15.11",
  "watchfiles==1.1.1",
  "werkzeug[watchdog]==3.1.8",
  "yelp-gprof2dot>=1.2.0",
]
test = [
  "coverage==7.13.5",
  "django-coverage-plugin==3.2.2",
  "hypothesis>=6.155.2",
  "pytest==9.0.3",
  "pytest-django==4.12.0",
  "pytest-sugar==1.1.1",
]
docs = [
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
]
stub = [
  "django-stubs[compatible-mypy]==6.0.3",
  "djangorestframework-stubs==3.16.9",
  "celery-types==0.26.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [ "*/migrations/*.py", "staticfiles/*" ]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = true

[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [ "mypy_django_plugin.main", "mypy_drf_plugin.main" ]
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.pyrefly]
python-version = "3.14.0"
preset = "legacy"
ignore-missing-imports = [ "*" ]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest]
# ==== pytest ====
ini_options.minversion = "6.0"
ini_options.addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
ini_options.python_files = [ "tests.py", "test_*.py" ]

[tool.coverage]
# ==== Coverage ====
run.include = [ "home_erp/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2

[tool.setuptools]
packages = ["home_erp", "config"]

