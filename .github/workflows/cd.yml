name: CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Verify production settings syntax
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: dummy-check-key-do-not-use-in-production
          DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy
          REDIS_URL: redis://localhost:6379/1
          DJANGO_ALLOWED_HOSTS: staging.home-erp.local
          DJANGO_ADMIN_URL: admin/
        run: |
          uv sync --frozen
          uv run python -c "import config.settings.production; print('Production settings syntax OK')"

      - name: Collect static files check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: dummy-check-key-do-not-use-in-production
          DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy
          REDIS_URL: redis://localhost:6379/1
          DJANGO_ALLOWED_HOSTS: staging.home-erp.local
          DJANGO_ADMIN_URL: admin/
        run: |
          uv run python manage.py collectstatic --no-input --dry-run

      - name: Execute deployment
        run: |
          echo "Deploying to staging environment..."
          # Insert host deployment script, SSH command, or container orchestrator update here
          echo "Staging deployment completed successfully."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Verify production configuration
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: dummy-check-key-do-not-use-in-production
          DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy
          REDIS_URL: redis://localhost:6379/1
          DJANGO_ALLOWED_HOSTS: home-erp.local
          DJANGO_ADMIN_URL: admin/
        run: |
          uv sync --frozen
          uv run python -c "import config.settings.production; print('Production configuration validated')"

      - name: Execute production deployment
        run: |
          echo "Deploying to production environment..."
          # Insert production deployment webhook, ansible playbook, or container rollout here
          echo "Production deployment completed successfully."
